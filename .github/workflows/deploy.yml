name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Version assets so browsers fetch the new copy
        run: |
          VERSION=$(git rev-parse --short HEAD)
          sed -i "s|href=\"style\.css\"|href=\"style.css?v=$VERSION\"|g" *.html
          sed -i "s|src=\"script\.js\"|src=\"script.js?v=$VERSION\"|g" *.html
          echo "Asset version: $VERSION"
          grep -o 'style\.css?v=[0-9a-f]*' index.html | head -1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
